# --- Mouse & scroll ---
set -g mouse on
set -g history-limit 50000

# Wheel: ở pane thường, lăn lên tự vào copy-mode để cuộn scrollback;
# nếu app đang bật mouse (TUI full-screen) thì gửi event cho app.
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" \
  "send-keys -M" \
  "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M

# Cuộn mượt từng dòng trong copy-mode
bind -T copy-mode-vi WheelUpPane   send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 1 scroll-down

# --- Status bar: session + prefix + zoom + git + pwd + CPU / RAM ---
set -g status on
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 110
# Nền tối để các màu segment (xanh lá/cyan/vàng) đọc được
set -g status-style "bg=colour235,fg=colour250"
set -g window-status-current-style "fg=colour231,bg=colour239,bold"
set -g window-status-style "fg=colour244"
# Trái: tên session; ô vàng " ^B " hiện ra khi đã bấm prefix
set -g status-left "#[fg=colour114,bold][#S]#[default]#{?client_prefix,#[fg=colour232]#[bg=colour221] ^B #[default],} "
# Phải: cờ zoom | git branch (* = dirty) | thư mục hiện tại | CPU/RAM | giờ
set -g status-right "#{?window_zoomed_flag,#[fg=colour221]ZOOM #[default],}#[fg=colour114]#(~/.tmux/scripts/gitstat.sh '#{pane_current_path}')#[default] #[fg=colour81]#{b:pane_current_path}#[default] | #(~/.tmux/scripts/sysstat.sh)  %H:%M"
